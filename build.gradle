plugins { id 'java' }

group = 'ru.vanillamon'
version = '2.2.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.3.build.230-stable'
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    testImplementation 'io.papermc.paper:paper-api:26.3.build.230-stable'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

}
test { useJUnitPlatform(); jvmArgs '--enable-native-access=ALL-UNNAMED' }
tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

jar {
    archiveFileName = "Pokemonika-Free-${version}.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class'
}
